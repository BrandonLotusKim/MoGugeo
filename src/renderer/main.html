<!DOCTYPE html>
<html lang="ko">
<head>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https:">
  <title>모구지오 - 로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: transparent;">
  <div class="login-window">
    <div class="login-titlebar">
      <div class="login-titlebar-drag"></div>
      <div class="login-titlebar-btns">
        <button class="titlebar-btn" id="btn-minimize" type="button">&#x2013;</button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" type="button">&#x2715;</button>
      </div>
    </div>

    <div class="login-body">
      <span class="eyebrow">모구지오</span>
      <h2 class="auth-title" style="margin-top: 12px;">로그인</h2>
      <p class="login-desc">모구지오와 함께 매일 꾸준히 영어 학습을 이어가세요.</p>
      <form data-login-form>
        <div class="field">
          <label for="username">아이디</label>
          <input class="text-input" id="username" type="text" placeholder="아이디를 입력하세요">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input class="text-input" id="password" type="password" placeholder="비밀번호를 입력하세요">
        </div>
        <div class="check-row muted small">
          <label><input type="checkbox"> 자동 로그인 유지</label>
          <span>학습 앱과 함께 시작</span>
        </div>
        <div class="login-actions">
          <button class="btn btn-primary" type="submit" style="width:100%;">로그인</button>
          <a class="btn btn-ghost" href="signup.html" style="width:100%;text-align:center;">회원가입</a>
        </div>
      </form>
    </div>
  </div>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
