<!DOCTYPE html>
<!-- 시작 화면: 이 PC에 저장된 로컬 프로필로 시작 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'">
  <title>모국어 - 시작</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: transparent;">
  <div class="login-window" data-login>
    <div class="login-titlebar">
      <div class="login-titlebar-drag"></div>
      <div class="login-titlebar-btns">
        <button class="titlebar-btn" id="btn-minimize" type="button" aria-label="최소화">&#x2013;</button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" type="button" aria-label="닫기">&#x2715;</button>
      </div>
    </div>

    <main class="login-body">
      <span class="eyebrow">모국어</span>
      <h1 class="auth-title" style="margin-top: 12px;">시작하기</h1>
      <p class="login-desc">학습 기록은 이 PC에만 저장됩니다. 계정 서버 연동은 다음 버전에서 제공할 예정입니다.</p>

      <section id="login-profile" hidden>
        <div class="profile-pick">
          <div class="profile-pick-avatar" id="login-avatar" aria-hidden="true"></div>
          <div>
            <strong class="profile-pick-name" id="login-nickname"></strong>
            <p class="fine-copy small" id="login-meta"></p>
          </div>
        </div>
        <div class="check-row muted small">
          <label for="login-auto"><input id="login-auto" type="checkbox"> 다음부터 이 화면 없이 바로 시작</label>
        </div>
        <div class="login-actions">
          <button class="btn btn-primary" id="btn-login-start" type="button">이 프로필로 시작</button>
          <a class="btn btn-ghost" href="signup.html">프로필 새로 만들기</a>
        </div>
      </section>

      <section id="login-empty" hidden>
        <div class="empty-state">
          <p class="empty-state-copy">이 PC에 저장된 프로필이 없습니다.<br>닉네임과 난이도만 정하면 바로 시작할 수 있습니다.</p>
          <p class="fine-copy small" id="login-existing-data" hidden>이전에 학습한 기록이 남아 있습니다. 프로필을 만들면 그대로 이어집니다.</p>
        </div>
        <div class="login-actions">
          <a class="btn btn-primary" href="signup.html">프로필 만들기</a>
        </div>
      </section>
    </main>
  </div>
  <script src="core.js"></script>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
