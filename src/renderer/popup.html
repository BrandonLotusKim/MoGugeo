<!DOCTYPE html>
<!-- 데일리 팝업: 지정 시각에 뜨는 2문제 학습 창 (창 제어는 OS 프레임 사용) -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'">
  <title>모국어 - 데일리 팝업</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="popup-stage">
    <section class="popup-window">
      <header class="window-header">
        <div class="window-brand"><span class="material-symbols-outlined" aria-hidden="true">auto_stories</span><span>모국어 데일리 팝업</span></div>
      </header>
      <div class="window-body">
        <h1 class="window-title" id="popup-title">오늘의 2문장</h1>
        <p class="hero-copy" id="popup-hero-copy">두 문제를 풀고 정답 확인을 누르세요.</p>

        <div class="task-stack" id="popup-task-stack">
          <article class="task-card" id="popup-task-1">
            <div class="section-label">과제 1 · 영어 → 한국어</div>
            <div class="problem-box"><p class="problem-text" id="popup-question-1">문장을 불러오는 중...</p></div>
            <div class="field">
              <label for="popup-answer-1">우리말 해석</label>
              <input class="text-input" id="popup-answer-1" type="text" placeholder="뜻을 우리말로 입력하세요">
            </div>
          </article>
          <article class="task-card" id="popup-task-2">
            <div class="section-label">과제 2 · 한국어 → 영어</div>
            <div class="problem-box"><p class="problem-text" id="popup-question-2">문장을 불러오는 중...</p></div>
            <div class="field">
              <label for="popup-answer-2">영어 문장</label>
              <input class="text-input" id="popup-answer-2" type="text" placeholder="영어 문장으로 입력하세요" lang="en">
            </div>
          </article>
        </div>

        <section class="task-card spacer-top" id="popup-result" hidden>
          <div class="section-label">결과</div>
          <div class="list-stack" id="popup-result-list"></div>
        </section>

        <div class="spacer-lg">
          <button class="btn btn-primary" id="popup-check" type="button" style="width: 100%;">정답 확인</button>
        </div>
        <p class="popup-message small" id="popup-message" role="status"></p>
        <div class="spacer-top" style="text-align: center;">
          <a class="link-action" id="popup-open-main" href="dashboard.html">모국어 메인 창 열기 <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>
        </div>
      </div>
      <footer class="window-footer">
        <div class="inline-actions">
          <span class="material-symbols-outlined" style="color: var(--accent);" aria-hidden="true">bolt</span>
          <span id="popup-footer-streak">0일 연속 학습</span>
        </div>
        <div id="popup-footer-time"></div>
      </footer>
    </section>
  </main>
  <script src="core.js"></script>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
