<!DOCTYPE html>
<!-- 회원가입 화면: 새 계정 생성 페이지 -->
<html lang="ko">
<head>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https:">
  <title>모구지오 - 회원가입</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <span class="eyebrow">모구지오</span>
      <h1 class="auth-title">새 계정 만들기</h1>
      <p class="auth-subtitle" style="color: #7d879c;">모구지오의 학습 기록과 데일리 팝업을 계속 사용하기 위한 계정을 만들어주세요.</p>
      <form data-signup-form>
        <div class="field">
          <label for="signup-username">아이디</label>
          <input class="text-input" id="signup-username" type="text" placeholder="영문, 숫자, 언더스코어 4~20자">
        </div>
        <div class="field">
          <label for="signup-password">비밀번호</label>
          <input class="text-input" id="signup-password" type="password" placeholder="8자 이상 입력하세요">
        </div>
        <div class="field">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <input class="text-input" id="signup-password-confirm" type="password" placeholder="비밀번호를 다시 입력하세요">
        </div>
        <div class="field">
          <label for="signup-nickname">닉네임</label>
          <input class="text-input" id="signup-nickname" type="text" placeholder="예: Arthur">
        </div>
        <div class="field">
          <label for="signup-email">이메일 (선택)</label>
          <input class="text-input" id="signup-email" type="text" placeholder="email@example.com">
        </div>
        <div class="field">
          <label for="signup-phone">휴대전화 (선택)</label>
          <input class="text-input" id="signup-phone" type="text" placeholder="숫자 또는 하이픈만 입력">
        </div>
        <div class="field">
          <label for="signup-carrier">통신사 (선택)</label>
          <select class="text-input" id="signup-carrier">
            <option value="">선택</option>
            <option value="SKT">SKT</option>
            <option value="KT">KT</option>
            <option value="LG U+">LG U+</option>
            <option value="알뜰폰">알뜰폰</option>
          </select>
        </div>
        <div class="check-row muted small">
          <label for="signup-agree"><input id="signup-agree" type="checkbox"> 약관 및 개인정보 수집에 동의합니다.</label>
        </div>
        <div class="inline-actions spacer-top">
          <button class="btn btn-primary" type="submit">회원가입</button>
          <a class="btn btn-ghost" href="main.html">이미 계정이 있으신가요? 로그인</a>
        </div>
      </form>
    </section>
  </main>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
