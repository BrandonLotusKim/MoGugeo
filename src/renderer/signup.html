<!DOCTYPE html>
<!-- 프로필 만들기: 닉네임과 난이도를 이 PC에 저장 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'">
  <title>모국어 - 프로필 만들기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: transparent;">
  <div class="login-window">
    <div class="login-titlebar">
      <div class="login-titlebar-drag"></div>
      <div class="login-titlebar-btns">
        <button class="titlebar-btn" id="btn-minimize" type="button" aria-label="최소화">&#x2013;</button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" type="button" aria-label="닫기">&#x2715;</button>
      </div>
    </div>

    <main class="login-body login-body-scroll">
      <span class="eyebrow">모국어</span>
      <h1 class="auth-title" style="margin-top: 12px;">프로필 만들기</h1>
      <p class="login-desc">비밀번호 없이 이 PC에 저장되는 로컬 프로필입니다.</p>
      <p class="notice-box small" id="signup-replace-notice" hidden></p>

      <form data-signup-form novalidate>
        <div class="field">
          <label for="signup-nickname">닉네임</label>
          <input class="text-input" id="signup-nickname" type="text" maxlength="16" autocomplete="nickname" aria-describedby="signup-nickname-help">
          <p class="field-help" id="signup-nickname-help">2~16자. 대시보드 인사말에 쓰입니다.</p>
        </div>

        <div class="field">
          <span class="field-label" id="signup-difficulty-label">난이도</span>
          <div class="choice-group" id="signup-difficulty" role="radiogroup" aria-labelledby="signup-difficulty-label" tabindex="-1">
            <label class="choice"><input type="radio" name="difficulty" value="beginner"><span><strong>초급</strong><small>짧은 일상 문장</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="intermediate"><span><strong>중급</strong><small>업무·여행 문장</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="advanced"><span><strong>고급</strong><small>긴 구문·추상 표현</small></span></label>
          </div>
        </div>

        <div class="check-row muted small">
          <label for="signup-agree"><input id="signup-agree" type="checkbox">
            <a data-external href="https://github.com/BrandonLotusKim/MoGugeo/blob/main/Document/TermsOfService.md">이용약관</a>과
            <a data-external href="https://github.com/BrandonLotusKim/MoGugeo/blob/main/Document/PrivacyPolicy.md">개인정보 처리방침</a>에 동의합니다.</label>
        </div>

        <div class="login-actions">
          <button class="btn btn-primary" type="submit">프로필 만들고 시작</button>
          <a class="btn btn-ghost" href="main.html">돌아가기</a>
        </div>
      </form>
    </main>
  </div>
  <script src="core.js"></script>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
