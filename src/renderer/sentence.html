<!DOCTYPE html>
<!-- 문장 학습·복습: 영어 문장 해석, 채점, 피드백 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'">
  <title>모국어 - 문장 학습</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell app-shell">
    <div class="main-area">
      <div class="app-titlebar">
        <div class="app-titlebar-drag"></div>
        <div class="topbar-window-btns">
          <button class="titlebar-btn" id="btn-minimize" type="button" aria-label="최소화">&#x2013;</button>
          <button class="titlebar-btn" id="btn-maximize" type="button" aria-label="최대화">&#x25A1;</button>
          <button class="titlebar-btn titlebar-btn-close" id="btn-close" type="button" aria-label="닫기">&#x2715;</button>
        </div>
      </div>
      <header class="topbar">
        <a class="topbar-brand" href="dashboard.html">모국어</a>
        <nav class="topbar-nav" aria-label="주 메뉴">
          <a href="dashboard.html">대시보드</a>
          <a href="sentence.html" class="active" aria-current="page">문장 학습</a>
          <a href="mypage.html">학업 성취도</a>
          <a href="settings.html">설정</a>
        </nav>
        <div class="topbar-actions">
          <span class="topbar-user"><span class="material-symbols-outlined" aria-hidden="true">person</span><span data-profile-name>학습자</span></span>
          <button class="icon-button" id="btn-menu-open" type="button" aria-label="메뉴 열기" aria-controls="slide-menu" aria-expanded="false"><span class="material-symbols-outlined" aria-hidden="true">menu</span></button>
        </div>
      </header>
      <div class="page-body-wrap"><main class="page-body">
        <section class="surface sentence-shell">
          <div class="sentence-header">
            <div>
              <div class="section-label">오늘의 목표</div>
              <div class="sentence-progress spacer-top">
                <div class="progress-bar"><div class="progress-fill" id="sentence-progress-bar" style="width: 0%;"></div></div>
                <strong id="sentence-progress-text">오늘 0 / 5문장</strong>
              </div>
            </div>
            <span class="chip" id="sentence-mode">새 문장</span>
          </div>

          <article class="sentence-card status-card" id="sentence-card">
            <button aria-label="영어 문장 발음 듣기" class="speaker-button" id="btn-play-audio" type="button"><span class="material-symbols-outlined" aria-hidden="true">volume_up</span></button>
            <h1 class="sentence-text" id="sentence-text" lang="en">문장을 불러오는 중...</h1>
            <p class="fine-copy small" id="audio-status" role="status"></p>
            <div class="input-panel field">
              <label class="section-label" for="translation">우리말 해석</label>
              <textarea class="answer-field" id="translation" placeholder="여기에 해석을 입력하세요 (Ctrl+Enter로 확인)"></textarea>
            </div>
            <div class="spacer-top">
              <button class="btn btn-primary" id="btn-check-sentence" type="button">해석 확인</button>
            </div>
          </article>

          <section class="exhausted-card status-card" id="sentence-exhausted" hidden>
            <span class="material-symbols-outlined exhausted-icon" aria-hidden="true">task_alt</span>
            <h1 class="section-title" id="exhausted-title"></h1>
            <p class="section-copy" id="exhausted-copy"></p>
            <div class="inline-actions spacer-top" id="exhausted-actions"></div>
          </section>

          <section id="feedback-section" hidden aria-live="polite">
            <div class="result-banner" id="sentence-result"></div>
            <div class="feedback-grid spacer-top">
              <article class="answer-box user-answer-box">
                <div class="section-label">내 답안</div>
                <p class="section-copy" id="feedback-user-answer"></p>
              </article>
              <article class="answer-box">
                <div class="section-label">모범 답안</div>
                <p class="section-copy" id="feedback-model-answer"></p>
              </article>
            </div>
            <article class="tip-box spacer-top">
              <div class="section-label">표현 팁</div>
              <p class="section-copy" id="feedback-tip"></p>
            </article>
            <article class="explain-box spacer-top">
              <div>
                <div class="section-label">문법 포인트</div>
                <p class="section-copy" id="feedback-grammar"></p>
              </div>
              <div>
                <div class="section-label">더 알아보기</div>
                <p class="section-copy" id="feedback-extra"></p>
              </div>
            </article>
          </section>

          <div class="pill-actions">
            <button class="btn btn-soft" id="btn-add-review" type="button">복습 노트에 추가</button>
            <button class="btn btn-primary" id="btn-next-sentence" type="button">다음 문장 <span class="material-symbols-outlined" aria-hidden="true">navigate_next</span></button>
          </div>
        </section>
        <footer class="page-footer">
          <div>© 2026 모국어</div>
          <nav aria-label="바닥글">
            <a data-external href="https://github.com/BrandonLotusKim/MoGugeo/issues">문제 신고</a>
            <a data-external href="https://github.com/BrandonLotusKim/MoGugeo/blob/main/Document/PrivacyPolicy.md">개인정보 처리방침</a>
            <a data-external href="https://github.com/BrandonLotusKim/MoGugeo/blob/main/Document/TermsOfService.md">이용약관</a>
          </nav>
        </footer>
      </main></div>
    </div>
  </div>
  <div class="menu-overlay" id="menu-overlay"></div>
  <aside class="slide-menu" id="slide-menu" aria-label="메뉴">
    <div class="slide-menu-header">
      <span class="brand-title" style="font-size:20px;">모국어</span>
      <button class="icon-button" id="btn-menu-close" type="button" aria-label="메뉴 닫기"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>
    <nav class="slide-menu-nav">
      <a href="dashboard.html"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span><span>대시보드</span></a>
      <a href="sentence.html" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">menu_book</span><span>문장 학습</span></a>
      <a href="mypage.html"><span class="material-symbols-outlined" aria-hidden="true">insights</span><span>학업 성취도</span></a>
      <a href="settings.html"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span>설정</span></a>
    </nav>
    <div class="slide-menu-footer">
      <button class="btn btn-ghost" data-logout type="button">로그아웃</button>
    </div>
  </aside>
  <script src="core.js"></script>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
